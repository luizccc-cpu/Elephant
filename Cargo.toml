[workspace]
resolver = "2"
members = [
  "crates/cad-math",
  "crates/cad-geom",
  "crates/cad-doc",
  "crates/cad-io",
  "crates/cad-commands",
  "crates/cad-render",
  "apps/elephant-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
slotmap = { version = "1.0", features = ["serde"] }
rstar = "0.12"
bytemuck = { version = "1.21", features = ["derive"] }
